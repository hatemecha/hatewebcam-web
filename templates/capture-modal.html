<div
  class="capture-preview-modal hidden"
  id="capturePreviewModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="capturePreviewTitle"
>
  <div class="capture-preview-card">
    <div class="capture-preview-header">
      <div class="section-title" id="capturePreviewTitle">Captura lista</div>
      <button
        class="btn btn-icon"
        id="btnCloseCapturePreview"
        type="button"
        aria-label="Cerrar vista previa"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="capture-preview-media">
      <img
        id="capturePreviewImage"
        class="hidden"
        alt="Vista previa de foto capturada"
      />
      <video
        id="capturePreviewVideo"
        class="hidden"
        controls
        playsinline
        preload="metadata"
      ></video>
    </div>
    <div class="capture-preview-meta">
      <div class="capture-preview-filename mono" id="capturePreviewFilename">
        -
      </div>
      <div class="capture-preview-info" id="capturePreviewInfo"></div>
      <div
        class="capture-preview-photo-tools hidden"
        id="capturePreviewPhotoTools"
      >
        <div class="capture-preview-tools-title">Mejora de foto</div>
        <label class="checkbox-group">
          <input type="checkbox" id="chkPreviewPhotoEnhancer" />
          <span>Mejorar antes de descargar</span>
        </label>
        <div class="slider-group hidden" id="previewPhotoEnhancerStrengthGroup">
          <div class="slider-label">
            <span>Intensidad</span
            ><span class="value" id="valPreviewPhotoEnhancerStrength">35%</span>
          </div>
          <input
            type="range"
            id="sldPreviewPhotoEnhancerStrength"
            min="0"
            max="100"
            step="1"
            value="35"
          />
        </div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnDownloadCapture" type="button">
          Descargar
        </button>
        <button class="btn" id="btnDiscardCapture" type="button">
          Descartar
        </button>
      </div>
    </div>
  </div>
</div>
