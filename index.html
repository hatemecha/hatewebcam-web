<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Webcam y editor de video local con filtros, detectores y exportación en el navegador."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data: ws://127.0.0.1:* ws://localhost:*; base-uri 'self'; object-src 'none'"
    />
    <title>hatewebcam</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="css/visual-fx.css" />
    <link rel="stylesheet" href="empty-source.css" />
  </head>

  <body>
    <div
      id="skipLinkMount"
      data-i18n-owner="svelte"
      style="display: contents"
    ></div>
    <!-- Header -->
    <header
      class="header-bar"
      id="appHeaderMount"
      data-i18n-owner="svelte"
    ></header>

    <div class="app-container">
      <!-- Preview -->
      <main class="preview-area">
        <div class="preview-wrapper" id="previewWrapper" tabindex="-1">
          <video
            id="videoElement"
            class="preview-source-video"
            autoplay
            playsinline
            muted
          ></video>
          <canvas id="previewCanvas"></canvas>
          <div
            id="previewPlaceholderMount"
            data-i18n-owner="svelte"
            style="display: contents"
          ></div>
          <div
            id="captureStatusMount"
            data-i18n-owner="svelte"
            style="display: contents"
          ></div>
          <div
            id="mobileHudMount"
            data-i18n-owner="svelte"
            style="display: contents"
          ></div>
        </div>
        <div
          id="captureBarMount"
          data-i18n-owner="svelte"
          style="display: contents"
        ></div>
        <div
          id="videoEditorTemplateSlot"
          data-i18n-owner="svelte"
          style="display: contents"
        ></div>
      </main>

      <!-- Controls -->
      <aside class="control-panel" id="controlPanel">
        <div
          id="cameraSourceMount"
          data-i18n-owner="svelte"
          style="display: contents"
        ></div>
        <div id="effectsControlsSlot" data-i18n-owner="svelte"></div>
      </aside>
    </div>

    <div id="exportModalTemplateSlot" data-i18n-owner="svelte"></div>

    <div id="captureModalTemplateSlot" data-i18n-owner="svelte"></div>
    <!-- App -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
