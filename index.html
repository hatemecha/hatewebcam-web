<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Webcam y editor de video local con filtros, detectores y exportación en el navegador."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data: ws://127.0.0.1:* ws://localhost:*; base-uri 'self'; object-src 'none'"
    />
    <title>hatewebcam</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="css/visual-fx.css" />
    <link rel="stylesheet" href="empty-source.css" />
  </head>

  <body>
    <a class="skip-link" href="#previewWrapper">Saltar al visor</a>
    <!-- Header -->
    <header class="header-bar" id="appHeaderMount"></header>

    <div class="app-container">
      <!-- Preview -->
      <main class="preview-area">
        <div class="preview-wrapper" id="previewWrapper" tabindex="-1">
          <video
            id="videoElement"
            class="preview-source-video"
            autoplay
            playsinline
            muted
          ></video>
          <canvas id="previewCanvas"></canvas>
          <div class="preview-placeholder" id="previewPlaceholder">
            <div
              class="preview-placeholder-view preview-placeholder-camera"
              id="previewPlaceholderCamera"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            >
              <i
                class="fa-solid fa-video fa-2x"
                id="cameraStateIcon"
                aria-hidden="true"
              ></i>
              <h2 class="camera-state-title" id="cameraStateTitle">
                Cámara apagada
              </h2>
              <p
                class="camera-state-message"
                id="previewPlaceholderCameraMessage"
              >
                Encendé la cámara para empezar.
              </p>
              <p class="camera-state-hint hidden" id="cameraStateHint"></p>
              <button
                type="button"
                class="btn primary camera-state-action"
                id="btnCameraStateAction"
              >
                <i class="fa-solid fa-play" aria-hidden="true"></i>
                <span>Encender cámara</span>
              </button>
              <p class="empty-state-footer">
                <i class="fa-solid fa-lock" aria-hidden="true"></i>
                La imagen se procesa en este navegador.
              </p>
            </div>
            <div
              class="preview-placeholder-view preview-placeholder-video hidden"
              id="previewPlaceholderVideo"
            >
              <div class="preview-import-card">
                <div class="preview-import-icon" aria-hidden="true">
                  <i class="fa-solid fa-clapperboard"></i>
                </div>
                <p class="preview-import-title">Empezá con un video</p>
                <p class="preview-import-hint">
                  Importá un archivo local para recortarlo, sumar efectos y
                  exportarlo.
                </p>
                <div class="preview-import-formats" aria-hidden="true">
                  <span>MP4</span>
                  <span>WebM</span>
                  <span>MOV</span>
                </div>
                <button
                  type="button"
                  class="btn primary preview-import-btn"
                  id="btnPreviewImportVideo"
                >
                  Importar video
                </button>
                <p class="preview-import-note">
                  Tu archivo no sale de este equipo.
                </p>
              </div>
            </div>
            <div
              class="preview-placeholder-view preview-placeholder-loading hidden"
              id="previewPlaceholderLoading"
            >
              <i
                class="fa-solid fa-spinner fa-spin fa-2x"
                aria-hidden="true"
              ></i>
              <div id="previewPlaceholderLoadingMessage">
                Leyendo metadata del video...
              </div>
            </div>
          </div>
          <div id="captureStatusMount" style="display: contents"></div>
          <div id="mobileHudMount" style="display: contents"></div>
        </div>
        <div class="preview-console-footer webcam-only">
          <div class="desktop-capture-bar" aria-label="Controles de captura">
            <label class="capture-timer-field" for="captureTimerSelect">
              <span class="capture-timer-label">Temporizador</span>
              <span class="select-wrapper capture-timer-select">
                <select
                  id="captureTimerSelect"
                  aria-label="Temporizador de foto"
                >
                  <option value="0">0 s</option>
                  <option value="5">5 s</option>
                  <option value="10">10 s</option>
                </select>
              </span>
            </label>
            <div
              class="capture-bar-status"
              id="captureStatus"
              role="status"
              aria-live="polite"
            ></div>
            <div class="capture-actions">
              <button
                type="button"
                class="photo-shutter"
                id="btnTakePhoto"
                aria-label="Sacar foto"
              >
                <span class="photo-shutter-core" aria-hidden="true"></span>
                <span class="capture-action-label">Foto</span>
              </button>
              <button
                type="button"
                class="record-trigger"
                id="btnRecord"
                aria-label="Grabar video"
              >
                <span class="record-trigger-core" aria-hidden="true"></span>
                <span class="capture-action-label">Grabar</span>
              </button>
            </div>
          </div>
          <div class="preview-status-bar">
            <div class="preview-diagnostics" id="previewMetricsMount"></div>
            <div
              class="detector-chips"
              id="effectsInfo"
              aria-label="Estado de detectores"
            ></div>
          </div>
        </div>
        <div id="videoEditorTemplateSlot"></div>
      </main>

      <!-- Controls -->
      <aside class="control-panel" id="controlPanel">
        <div id="cameraSourceMount" style="display: contents"></div>
        <div id="effectsControlsSlot"></div>
      </aside>
    </div>

    <div id="exportModalTemplateSlot"></div>

    <div id="captureModalTemplateSlot"></div>
    <!-- App -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
