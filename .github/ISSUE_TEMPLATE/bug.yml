name: Error
description: Algo no funciona como debería
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Este es un proyecto personal en beta. Incluí pasos reproducibles y el navegador.
        No adjuntés grabaciones ni datos personales de terceros.
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
      placeholder: Qué esperabas y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y sistema
      placeholder: Chrome 128 / Fedora 43
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Modo
      options:
        - Webcam
        - Video
        - Ambos / no estoy seguro
    validations:
      required: true
